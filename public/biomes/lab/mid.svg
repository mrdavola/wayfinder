<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="shelf-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7a5a30"/>
      <stop offset="100%" stop-color="#5a3a18"/>
    </linearGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#dfe6cc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#b6c19a" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Specimen shelf, upper left -->
  <g transform="translate(40,420)">
    <rect width="220" height="14" fill="url(#shelf-wood)"/>
    <rect y="100" width="220" height="14" fill="url(#shelf-wood)"/>
    <!-- Jars -->
    <rect x="20"  y="40" width="36" height="60" rx="4" fill="url(#jar)" stroke="#7a684a" stroke-width="1.5"/>
    <rect x="68"  y="30" width="40" height="70" rx="4" fill="url(#jar)" stroke="#7a684a" stroke-width="1.5"/>
    <rect x="120" y="50" width="32" height="50" rx="4" fill="url(#jar)" stroke="#7a684a" stroke-width="1.5"/>
    <rect x="164" y="35" width="38" height="65" rx="4" fill="url(#jar)" stroke="#7a684a" stroke-width="1.5"/>
    <!-- Jar contents (specimen silhouettes) -->
    <ellipse cx="38"  cy="80" rx="10" ry="14" fill="#5a7a3a" opacity="0.5"/>
    <path d="M88,90 Q88,60 92,55" stroke="#3d5a28" stroke-width="2" fill="none"/>
    <circle cx="136" cy="80" r="8" fill="#b8443a" opacity="0.4"/>
    <ellipse cx="183" cy="80" rx="9" ry="12" fill="#7a5a2a" opacity="0.5"/>
  </g>

  <!-- Workbench -->
  <g>
    <rect x="380" y="650" width="900" height="20" fill="#5a4630"/>
    <rect x="380" y="670" width="900" height="60" fill="url(#shelf-wood)"/>
    <!-- Bench legs -->
    <rect x="400"  y="730" width="20" height="170" fill="#3d2a18"/>
    <rect x="1240" y="730" width="20" height="170" fill="#3d2a18"/>
    <!-- Drawer -->
    <rect x="500"  y="685" width="120" height="32" fill="#6b4e2a" stroke="#3d2a18" stroke-width="1.5"/>
    <circle cx="560" cy="701" r="3" fill="#3d2a18"/>
  </g>

  <!-- Microscope on bench, far left of bench -->
  <g transform="translate(440,560)">
    <rect x="20" y="80" width="40" height="10" fill="#3d3530"/>
    <rect x="32" y="20" width="16" height="60" fill="#5a504a"/>
    <circle cx="40" cy="14" r="10" fill="#2a2520"/>
    <rect x="36" y="60" width="8" height="12" fill="#2a2520"/>
  </g>

  <!-- Beakers cluster, mid bench -->
  <g transform="translate(700,600)">
    <path d="M0,30 L0,80 L40,80 L40,30 Z" fill="url(#jar)" stroke="#5a4630" stroke-width="1.5"/>
    <path d="M50,40 L50,80 L84,80 L84,40 Z" fill="url(#jar)" stroke="#5a4630" stroke-width="1.5"/>
    <line x1="0"  y1="55" x2="40" y2="55" stroke="#3d5a28" stroke-width="1" opacity="0.6"/>
    <line x1="50" y1="62" x2="84" y2="62" stroke="#b8443a" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Open notebook on bench -->
  <g transform="translate(900,620)">
    <rect width="120" height="60" rx="3" fill="#f4ebd4" stroke="#7a684a" stroke-width="1.5"/>
    <line x1="60" y1="0" x2="60" y2="60" stroke="#7a684a" stroke-width="1"/>
    <line x1="10" y1="18" x2="50" y2="18" stroke="#7a684a" stroke-width="0.7" opacity="0.5"/>
    <line x1="10" y1="28" x2="48" y2="28" stroke="#7a684a" stroke-width="0.7" opacity="0.5"/>
    <line x1="10" y1="38" x2="52" y2="38" stroke="#7a684a" stroke-width="0.7" opacity="0.5"/>
    <line x1="70" y1="18" x2="110" y2="18" stroke="#7a684a" stroke-width="0.7" opacity="0.5"/>
  </g>

  <!-- Stack of books -->
  <g transform="translate(1100,640)">
    <rect width="120" height="14" fill="#7a3a30"/>
    <rect y="14" width="120" height="14" fill="#5a4a30"/>
    <rect y="28" width="120" height="14" fill="#3d5a28"/>
  </g>

  <!-- Tall plant in pot, right side -->
  <g transform="translate(1380,460)">
    <rect x="20" y="240" width="80" height="60" fill="#7a5a30" stroke="#3d2a18" stroke-width="2"/>
    <path d="M60,240 Q40,180 50,120 Q60,80 70,40 Q80,80 90,140 Q100,200 80,240"
          stroke="#3d5a28" stroke-width="2" fill="#5a7a3a" opacity="0.85"/>
    <ellipse cx="48"  cy="100" rx="14" ry="6" fill="#5a7a3a" opacity="0.8" transform="rotate(-25 48 100)"/>
    <ellipse cx="84"  cy="120" rx="14" ry="6" fill="#5a7a3a" opacity="0.8" transform="rotate(30 84 120)"/>
    <ellipse cx="40"  cy="160" rx="14" ry="6" fill="#5a7a3a" opacity="0.8" transform="rotate(-30 40 160)"/>
  </g>
</svg>
