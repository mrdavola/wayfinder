<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lab-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e6decb"/>
      <stop offset="100%" stop-color="#c5b896"/>
    </linearGradient>
    <linearGradient id="lab-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#a08a64"/>
      <stop offset="100%" stop-color="#7d6a48"/>
    </linearGradient>
    <pattern id="floorboard" x="0" y="0" width="120" height="20" patternUnits="userSpaceOnUse">
      <rect width="120" height="20" fill="url(#lab-floor)"/>
      <line x1="0" y1="20" x2="120" y2="20" stroke="#5e4d2e" stroke-width="0.6" opacity="0.4"/>
      <line x1="60" y1="0" x2="60" y2="20" stroke="#5e4d2e" stroke-width="0.4" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Wall -->
  <rect width="1600" height="640" fill="url(#lab-wall)"/>

  <!-- Picture rail trim -->
  <rect y="630" width="1600" height="6" fill="#7a684a" opacity="0.6"/>

  <!-- Window with view to garden -->
  <g>
    <rect x="180"  y="120" width="280" height="320" fill="#dfe6cc" stroke="#7a684a" stroke-width="6"/>
    <line x1="320" y1="120" x2="320" y2="440" stroke="#7a684a" stroke-width="3"/>
    <line x1="180" y1="280" x2="460" y2="280" stroke="#7a684a" stroke-width="3"/>
    <!-- Garden glimpse -->
    <ellipse cx="240" cy="380" rx="40" ry="18" fill="#8aa468" opacity="0.7"/>
    <ellipse cx="380" cy="395" rx="50" ry="20" fill="#7a9858" opacity="0.6"/>
    <circle cx="260" cy="220" r="36" fill="#f6e3b0" opacity="0.5"/>
  </g>

  <!-- Framed botanical print -->
  <g transform="translate(700,140)">
    <rect width="180" height="220" fill="#f4ebd4" stroke="#5a4630" stroke-width="6"/>
    <path d="M90,40 Q70,90 80,160 Q70,180 90,200" stroke="#3d5a28" stroke-width="3" fill="none"/>
    <ellipse cx="68"  cy="90"  rx="14" ry="6" fill="#5a7a3a" opacity="0.7" transform="rotate(-30 68 90)"/>
    <ellipse cx="112" cy="120" rx="14" ry="6" fill="#5a7a3a" opacity="0.7" transform="rotate(30 112 120)"/>
    <ellipse cx="72"  cy="150" rx="14" ry="6" fill="#5a7a3a" opacity="0.7" transform="rotate(-25 72 150)"/>
  </g>

  <!-- Wall map -->
  <g transform="translate(1080,160)">
    <rect width="320" height="240" fill="#efe2c3" stroke="#5a4630" stroke-width="5"/>
    <path d="M30,120 Q80,80 140,110 Q200,140 250,100 Q290,80 300,120"
          stroke="#7a5a30" stroke-width="2" fill="none" opacity="0.8"/>
    <circle cx="80"  cy="110" r="4" fill="#b8443a"/>
    <circle cx="180" cy="130" r="4" fill="#b8443a"/>
    <circle cx="260" cy="105" r="4" fill="#b8443a"/>
    <text x="160" y="40" font-family="Georgia,serif" font-size="16" text-anchor="middle" fill="#5a4630" opacity="0.7">Field Map</text>
  </g>

  <!-- Floor -->
  <rect y="640" width="1600" height="260" fill="url(#floorboard)"/>
</svg>
