<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bench-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8a5a30"/>
      <stop offset="100%" stop-color="#5a3a18"/>
    </linearGradient>
  </defs>

  <!-- Heavy workbench across foreground -->
  <g>
    <rect x="200" y="640" width="1200" height="24" fill="#5a3a18"/>
    <rect x="200" y="664" width="1200" height="80" fill="url(#bench-wood)"/>
    <!-- bench legs -->
    <rect x="220"  y="744" width="28" height="156" fill="#3d2a18"/>
    <rect x="1352" y="744" width="28" height="156" fill="#3d2a18"/>
    <!-- Vise on left edge -->
    <g transform="translate(220,610)">
      <rect width="60" height="40" fill="#3a3a3a"/>
      <rect x="50" y="6" width="10" height="28" fill="#5a5a5a"/>
      <circle cx="62" cy="20" r="8" fill="#3a3a3a"/>
    </g>
  </g>

  <!-- Hand plane -->
  <g transform="translate(380,600)">
    <rect width="80" height="22" rx="2" fill="#7a5a30"/>
    <rect x="20" y="-8" width="20" height="16" fill="#3a3a3a"/>
    <rect x="50" y="-4" width="22" height="10" fill="#5a4a30"/>
  </g>

  <!-- Pile of wood scraps -->
  <g transform="translate(520,580)">
    <rect width="120" height="16" rx="2" fill="#a98a5a"/>
    <rect y="14" x="8" width="100" height="14" rx="2" fill="#8a6a3a"/>
    <rect y="28" x="20" width="80" height="14" rx="2" fill="#7a5a2a"/>
  </g>

  <!-- Project-in-progress: small wooden box -->
  <g transform="translate(720,560)">
    <rect width="180" height="100" fill="url(#bench-wood)" stroke="#3d2a18" stroke-width="2"/>
    <rect width="180" height="14" fill="#5a3a18"/>
    <line x1="0" y1="14" x2="180" y2="14" stroke="#3d2a18" stroke-width="1"/>
    <circle cx="90" cy="60" r="6" fill="#3d2a18"/>
  </g>

  <!-- Drawing pad with pencil -->
  <g transform="translate(960,610)">
    <rect width="160" height="40" fill="#f4ebd4" stroke="#7a684a" stroke-width="1.5"/>
    <line x1="20" y1="14" x2="120" y2="14" stroke="#5a4630" stroke-width="0.8" opacity="0.5"/>
    <line x1="20" y1="22" x2="100" y2="22" stroke="#5a4630" stroke-width="0.8" opacity="0.5"/>
    <line x1="20" y1="30" x2="110" y2="30" stroke="#5a4630" stroke-width="0.8" opacity="0.5"/>
    <!-- Pencil -->
    <rect x="120" y="-8" width="60" height="6" rx="1" fill="#c8a840" transform="rotate(-15 120 -8)"/>
    <polygon points="178,2 184,5 178,8" fill="#3a2a18" transform="rotate(-15 120 -8)"/>
  </g>

  <!-- Coffee mug -->
  <g transform="translate(1180,610)">
    <rect width="50" height="50" rx="3" fill="#c4a870" stroke="#5a3a18" stroke-width="2"/>
    <path d="M50,12 Q66,20 50,38" stroke="#5a3a18" stroke-width="3" fill="none"/>
    <ellipse cx="25" cy="14" rx="20" ry="4" fill="#3a2a18" opacity="0.7"/>
  </g>
</svg>
