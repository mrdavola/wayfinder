<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#6b4e2a"/>
      <stop offset="100%" stop-color="#4a3420"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5a7a3a"/>
      <stop offset="100%" stop-color="#3d5a28"/>
    </linearGradient>
  </defs>

  <!-- Mid-plane terrain -->
  <path d="M0,720 Q400,690 800,705 Q1200,720 1600,700 L1600,900 L0,900 Z"
        fill="#b8a070" opacity="0.55"/>

  <!-- Left cluster of trees -->
  <g>
    <rect x="80"  y="520" width="20" height="200" fill="url(#trunk)"/>
    <ellipse cx="90"  cy="510" rx="62" ry="78" fill="url(#canopy)" opacity="0.92"/>
    <rect x="160" y="540" width="16" height="180" fill="url(#trunk)"/>
    <ellipse cx="168" cy="530" rx="48" ry="66" fill="url(#canopy)" opacity="0.88"/>
    <rect x="230" y="560" width="14" height="160" fill="url(#trunk)"/>
    <ellipse cx="237" cy="552" rx="40" ry="56" fill="url(#canopy)" opacity="0.85"/>
  </g>

  <!-- Right cluster -->
  <g>
    <rect x="1420" y="510" width="22" height="210" fill="url(#trunk)"/>
    <ellipse cx="1431" cy="498" rx="68" ry="82" fill="url(#canopy)" opacity="0.92"/>
    <rect x="1480" y="540" width="18" height="180" fill="url(#trunk)"/>
    <ellipse cx="1489" cy="528" rx="54" ry="70" fill="url(#canopy)" opacity="0.88"/>
  </g>

  <!-- Lone tree behind stage 3 area -->
  <g opacity="0.85">
    <rect x="1280" y="560" width="14" height="160" fill="url(#trunk)"/>
    <ellipse cx="1287" cy="554" rx="42" ry="58" fill="url(#canopy)"/>
  </g>
</svg>
