<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e9dfc2"/>
      <stop offset="55%" stop-color="#f3e8c8"/>
      <stop offset="100%" stop-color="#e0cf9e"/>
    </linearGradient>
    <linearGradient id="far-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#9a8868"/>
      <stop offset="100%" stop-color="#7d6a48"/>
    </linearGradient>
    <linearGradient id="mid-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#86714c"/>
      <stop offset="100%" stop-color="#5e4d2e"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Soft sun -->
  <circle cx="1180" cy="180" r="70" fill="#f6e3b0" opacity="0.55"/>
  <circle cx="1180" cy="180" r="40" fill="#f9ecc6" opacity="0.85"/>

  <!-- Distant mountain ridge -->
  <path d="M0,520 L180,400 L320,470 L460,360 L640,460 L820,380 L980,470 L1180,400 L1380,470 L1600,420 L1600,900 L0,900 Z"
        fill="url(#far-hill)" opacity="0.55"/>

  <!-- Closer rolling hills -->
  <path d="M0,610 Q220,540 460,580 Q700,620 940,560 Q1180,500 1400,560 Q1500,580 1600,560 L1600,900 L0,900 Z"
        fill="url(#mid-hill)" opacity="0.7"/>

  <!-- Far tree silhouettes along ridge -->
  <g fill="#5e4f30" opacity="0.55">
    <path d="M120,560 L132,512 L144,560 Z"/>
    <path d="M138,562 L150,506 L162,562 Z"/>
    <path d="M310,558 L322,510 L334,558 Z"/>
    <path d="M520,548 L534,498 L548,548 Z"/>
    <path d="M540,552 L554,500 L568,552 Z"/>
    <path d="M780,546 L795,494 L810,546 Z"/>
    <path d="M1020,540 L1034,490 L1048,540 Z"/>
    <path d="M1240,548 L1255,494 L1270,548 Z"/>
    <path d="M1450,552 L1465,500 L1480,552 Z"/>
    <path d="M1470,556 L1486,502 L1502,556 Z"/>
  </g>
</svg>
