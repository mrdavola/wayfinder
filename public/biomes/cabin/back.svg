<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cab-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e6d6b0"/>
      <stop offset="100%" stop-color="#c8b388"/>
    </linearGradient>
    <linearGradient id="cab-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#a08a64"/>
      <stop offset="100%" stop-color="#7d6a48"/>
    </linearGradient>
    <pattern id="cab-planks" x="0" y="0" width="180" height="22" patternUnits="userSpaceOnUse">
      <rect width="180" height="22" fill="url(#cab-floor)"/>
      <line x1="0" y1="22" x2="180" y2="22" stroke="#5e4d2e" stroke-width="0.7" opacity="0.4"/>
      <line x1="90" y1="0" x2="90" y2="22" stroke="#5e4d2e" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Wood ceiling beam -->
  <rect width="1600" height="48" fill="#5a3a18"/>
  <rect y="48" width="1600" height="6" fill="#3d2a18" opacity="0.7"/>

  <!-- Wall -->
  <rect y="54" width="1600" height="640" fill="url(#cab-wall)"/>

  <!-- Hearth (stone fireplace) center -->
  <g transform="translate(600,300)">
    <rect width="400" height="400" fill="#7a685a"/>
    <!-- Stone texture -->
    <g fill="#5a4a3a" opacity="0.7">
      <rect x="0"   y="0"   width="80"  height="60"/>
      <rect x="80"  y="0"   width="100" height="60"/>
      <rect x="180" y="0"   width="80"  height="60"/>
      <rect x="260" y="0"   width="80"  height="60"/>
      <rect x="340" y="0"   width="60"  height="60"/>
      <rect x="40"  y="60"  width="80"  height="60"/>
      <rect x="120" y="60"  width="100" height="60"/>
      <rect x="220" y="60"  width="80"  height="60"/>
      <rect x="300" y="60"  width="100" height="60"/>
    </g>
    <g stroke="#3d2a18" stroke-width="1.5" fill="none" opacity="0.6">
      <line x1="0"   y1="60"  x2="400" y2="60"/>
      <line x1="0"   y1="120" x2="400" y2="120"/>
      <line x1="80"  y1="0"   x2="80"  y2="60"/>
      <line x1="180" y1="0"   x2="180" y2="60"/>
      <line x1="260" y1="0"   x2="260" y2="60"/>
      <line x1="340" y1="0"   x2="340" y2="60"/>
      <line x1="40"  y1="60"  x2="40"  y2="120"/>
      <line x1="120" y1="60"  x2="120" y2="120"/>
      <line x1="220" y1="60"  x2="220" y2="120"/>
      <line x1="300" y1="60"  x2="300" y2="120"/>
    </g>
    <!-- Mantel -->
    <rect x="-30" y="180" width="460" height="24" fill="#5a3a18"/>
    <rect x="-30" y="204" width="460" height="6"  fill="#3d2a18" opacity="0.7"/>
    <!-- Hearth opening -->
    <rect x="100" y="220" width="200" height="180" fill="#1a1208"/>
    <!-- Fire glow -->
    <ellipse cx="200" cy="370" rx="60" ry="20" fill="#e8a840" opacity="0.7"/>
    <path d="M170,370 Q180,330 200,310 Q220,330 230,370 Q220,355 200,365 Q180,355 170,370 Z"
          fill="#f4c060" opacity="0.85"/>
    <path d="M188,370 Q195,348 200,335 Q205,348 212,370 Q205,360 200,365 Q195,360 188,370 Z"
          fill="#fde4a0" opacity="0.85"/>
  </g>

  <!-- Window left -->
  <g transform="translate(120,160)">
    <rect width="240" height="280" fill="#dfe6cc" stroke="#5a3a18" stroke-width="6"/>
    <line x1="120" y1="0"  x2="120" y2="280" stroke="#5a3a18" stroke-width="3"/>
    <line x1="0"   y1="140" x2="240" y2="140" stroke="#5a3a18" stroke-width="3"/>
    <ellipse cx="80"  cy="220" rx="40" ry="20" fill="#7a8c4a" opacity="0.7"/>
    <ellipse cx="180" cy="240" rx="50" ry="22" fill="#5a7a3a" opacity="0.6"/>
  </g>

  <!-- Window right -->
  <g transform="translate(1240,160)">
    <rect width="240" height="280" fill="#dfe6cc" stroke="#5a3a18" stroke-width="6"/>
    <line x1="120" y1="0"  x2="120" y2="280" stroke="#5a3a18" stroke-width="3"/>
    <line x1="0"   y1="140" x2="240" y2="140" stroke="#5a3a18" stroke-width="3"/>
    <ellipse cx="80"  cy="220" rx="40" ry="20" fill="#7a8c4a" opacity="0.7"/>
    <ellipse cx="180" cy="240" rx="50" ry="22" fill="#5a7a3a" opacity="0.6"/>
  </g>

  <!-- Floor -->
  <rect y="694" width="1600" height="206" fill="url(#cab-planks)"/>
</svg>
